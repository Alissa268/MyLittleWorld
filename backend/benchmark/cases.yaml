# 固定案例 benchmark（2026-10-28 baseline）
# accept_departments 使用知識庫 department_canonical_mapping.json 的 canonical childDept 名稱。
# 原始需求的名稱若對不上，已依實際名稱改寫（見 docs/BENCHMARK_BASELINE_20261028.md「科別名稱對照」）。
# patient_mode:
#   simulate     模擬病人依 present/absent 回答
#   always_unknown  每題一律回答「不知道」

cases:
  - id: c01_back_pain_monday
    opening: 周一開始腰酸背痛
    present: [大腿根部麻, 有點側彎, 髖關節痛]
    absent: []
    accept_departments: [一般骨科, 復健醫學, 神經外科, 神經內科, 疼痛控制科]
    expect_urgent: false

  - id: c02_back_pain
    opening: 腰痠背痛
    present: [大腿根部麻, 有點側彎, 髖關節痛]
    absent: []
    accept_departments: [一般骨科, 復健醫學, 神經外科, 神經內科, 疼痛控制科]
    expect_urgent: false

  - id: c03_dizziness_tinnitus
    opening: 最近常常頭暈
    present: [耳鳴, 聽力變差]
    absent: []
    accept_departments: [耳科, 鼻科, 喉科]
    expect_urgent: false

  - id: c04_cough_two_weeks
    opening: 咳嗽咳了兩個禮拜
    present: [有痰, 走路會喘]
    absent: [發燒, 咳血]
    accept_departments: [胸腔內科]
    expect_urgent: false

  - id: c05_finger_joint_pain
    opening: 手指關節痛
