    absent: []
    accept_departments: [過敏免疫風濕]
    expect_urgent: false

  - id: c06_fever_sore_throat
    opening: 這幾天發燒
    present: [喉嚨痛, 咳嗽]
    absent: []
    accept_departments: [感染科, 一般內科, 耳科, 鼻科, 喉科]
    expect_urgent: false

  - id: c07_frequent_urination
    opening: 最近一直跑廁所
    present: [小便痛, 小便灼熱]
